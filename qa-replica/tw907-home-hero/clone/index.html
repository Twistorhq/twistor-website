<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<title>Replica clone: Twistor homepage hero (TW-907)</title>
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('fonts/bricolage-grotesque-latin-700-normal.gtcctNPv.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #FAF7F2; --surface: #FFFFFF; --ink: #1C1A17; --muted: #5F5A54;
    --accent: #FF5A1F; --accent-text: #B5430E; --line: #E5DFD5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    margin: 0; color: var(--ink); background: var(--bg);
    line-height: 1.6; font-size: 1rem;
  }
  h1 { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  .hero { padding: 88px 0 64px; }
  .hero h1 { font-size: 3rem; line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 16px; font-weight: 700; }
  .hero h1 span { color: var(--accent-text); }
  .hero p { font-size: 1.2rem; color: var(--muted); max-width: 640px; }
  .cta-row { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1rem; }
  .btn-primary { background: var(--accent); color: #1C1A17; }
  .btn-ghost { border: 1px solid var(--line); color: var(--ink); }
  @media (max-width: 640px) { .hero h1 { font-size: 2.2rem; } }
</style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>The company that <span>does it all.</span></h1>
      <p>Twistor builds AI systems that answer your phones, recover your revenue, and run your operations. One platform, every product. Designed, deployed, and supported by the team that builds it.</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="#contact">Book a demo</a>
        <a class="btn btn-ghost" href="#products">See the products</a>
      </div>
    </section>
  </main>
</body>
</html>

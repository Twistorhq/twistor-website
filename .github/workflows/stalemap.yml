# TW-668 PROPOSAL (Jalen, DevEx) - not yet approved for merge.
# Prepared by Twistor Holdings LLC.
#
# Purpose: keep the stalemap block in AGENTS.md fresh. The job fails
# when dependency pins change after the coding model's training
# cutoff without a `stalemap sync`, so agents never silently code
# against stale APIs. Uses the upstream GitHub Action from
# Umair/stalemap (MIT, Copyright (c) 2026 Umair Ejaz and stalemap
# contributors), pinned to the stalemap npm version we run locally.
#
# Apply: merge this file as-is. No secrets needed in check mode.
# Refresh flow when it fails: run
#   npx stalemap@0.4.1 sync --model claude-sonnet-4-5 --all
# and commit the updated AGENTS.md.
name: stalemap

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"

jobs:
  stalemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Umair/stalemap@main
        with:
          mode: check
          model: claude-sonnet-4-5
          working-directory: .
          args: --all
          version: 0.4.1
